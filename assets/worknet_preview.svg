<svg viewBox="0 0 480 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WorkNet split-tunnel diagram: Mac routing work traffic through VPN and internet traffic directly home">

    <!-- Card background: warm parchment, sits as a lit document on the shelf -->
    <rect width="480" height="280" rx="4" fill="#F5F0E8"/>

    <!-- Subtle inner border -->
    <rect x="1" y="1" width="478" height="278" rx="3" fill="none" stroke="rgba(44,31,20,0.12)" stroke-width="1"/>

    <!-- Top header band -->
    <rect x="0" y="0" width="480" height="42" rx="4" fill="rgba(44,31,20,0.07)"/>
    <rect x="0" y="36" width="480" height="6" fill="rgba(44,31,20,0.04)"/>

    <!-- Title -->
    <text x="20" y="26" font-family="'DM Sans',sans-serif" font-size="13" font-weight="700" fill="rgba(44,31,20,0.75)" letter-spacing="0.06em">WORKNET</text>
    <text x="110" y="26" font-family="'DM Sans',sans-serif" font-size="10" fill="rgba(44,31,20,0.35)" letter-spacing="0.04em">v1.3</text>

    <!-- Subtitle -->
    <text x="460" y="26" text-anchor="end" font-family="'DM Sans',sans-serif" font-size="9" fill="rgba(44,31,20,0.4)" font-style="italic">split-tunnel VPN utility</text>

    <!-- Mac node (left) -->
    <g transform="translate(72, 148)">
        <rect x="-34" y="-30" width="68" height="50" rx="5" fill="#EDE6D8" stroke="rgba(44,31,20,0.2)" stroke-width="1.5"/>
        <rect x="-26" y="-24" width="52" height="36" rx="2" fill="rgba(44,31,20,0.08)" stroke="rgba(44,31,20,0.12)" stroke-width="1"/>
        <rect x="-22" y="-20" width="44" height="28" rx="1" fill="rgba(44,31,20,0.05)"/>
        <line x1="-16" y1="-13" x2="8"  y2="-13" stroke="#3A5C3B" stroke-width="1.5" opacity="0.7"/>
        <line x1="-16" y1="-7"  x2="2"  y2="-7"  stroke="rgba(58,92,59,0.45)" stroke-width="1"/>
        <line x1="-16" y1="-1"  x2="10" y2="-1"  stroke="rgba(58,92,59,0.45)" stroke-width="1"/>
        <line x1="-16" y1="5"   x2="-2" y2="5"   stroke="rgba(58,92,59,0.35)" stroke-width="1"/>
        <rect x="-2" y="2" width="4" height="6" rx="1" fill="#3A5C3B" opacity="0.6"/>
        <rect x="-4" y="20" width="8" height="7" fill="rgba(44,31,20,0.15)"/>
        <rect x="-14" y="27" width="28" height="3" rx="1" fill="rgba(44,31,20,0.15)"/>
        <text y="46" text-anchor="middle" font-family="'DM Sans',sans-serif" font-size="10" font-weight="600" fill="rgba(44,31,20,0.55)">MacBook</text>
    </g>

    <!-- Fork point -->
    <circle cx="148" cy="148" r="3.5" fill="rgba(44,31,20,0.2)" stroke="rgba(44,31,20,0.3)" stroke-width="1"/>
    <line x1="106" y1="148" x2="144" y2="148" stroke="rgba(44,31,20,0.2)" stroke-width="1.5"/>

    <!-- Upper path: work traffic (burg) -->
    <path d="M 151 145 Q 202 96 252 86" fill="none" stroke="#7B2D3A" stroke-width="2" stroke-linecap="round"/>
    <polygon points="252,81 264,86 252,91" fill="#7B2D3A"/>
    <text x="192" y="100" font-family="'DM Sans',sans-serif" font-size="8" fill="rgba(123,45,58,0.75)" font-style="italic">10.x · 172.x</text>

    <!-- Lower path: direct internet (green) -->
    <path d="M 151 151 Q 202 200 252 210" fill="none" stroke="#3A5C3B" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
    <polygon points="252,205 264,210 252,215" fill="#3A5C3B" opacity="0.75"/>
    <text x="180" y="220" font-family="'DM Sans',sans-serif" font-size="8" fill="rgba(58,92,59,0.75)" font-style="italic">everything else</text>

    <!-- VPN Hardware (upper right) -->
    <g transform="translate(318, 86)">
        <rect x="-56" y="-32" width="112" height="64" rx="6" fill="#EDE6D8" stroke="rgba(123,45,58,0.35)" stroke-width="1.5"/>
        <rect x="-40" y="-20" width="48" height="32" rx="3" fill="rgba(123,45,58,0.1)" stroke="rgba(123,45,58,0.25)" stroke-width="1"/>
        <circle cx="18" cy="-4" r="5" fill="#7B2D3A" opacity="0.8"/>
        <circle cx="18" cy="-4" r="8" fill="rgba(123,45,58,0.12)"/>
        <line x1="-36" y1="-10" x2="-18" y2="-10" stroke="rgba(123,45,58,0.4)" stroke-width="1.5"/>
        <line x1="-36" y1="-2"  x2="-18" y2="-2"  stroke="rgba(123,45,58,0.3)" stroke-width="1.5"/>
        <line x1="-36" y1="6"   x2="-18" y2="6"   stroke="rgba(123,45,58,0.2)" stroke-width="1.5"/>
        <text x="0" y="44" text-anchor="middle" font-family="'DM Sans',sans-serif" font-size="9" font-weight="700" fill="rgba(123,45,58,0.8)" letter-spacing="0.04em">VPN Hardware</text>
    </g>

    <!-- VPN to Hospital -->
    <line x1="375" y1="86" x2="404" y2="86" stroke="rgba(123,45,58,0.4)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="404,82 414,86 404,90" fill="rgba(123,45,58,0.4)"/>

    <!-- Hospital servers -->
    <g transform="translate(442, 86)">
        <rect x="-28" y="-32" width="56" height="64" rx="4" fill="#EDE6D8" stroke="rgba(123,45,58,0.25)" stroke-width="1"/>
        <rect x="-18" y="-22" width="36" height="8" rx="2" fill="rgba(123,45,58,0.15)"/>
        <rect x="-18" y="-10" width="36" height="8" rx="2" fill="rgba(123,45,58,0.1)"/>
        <rect x="-18" y="2"   width="36" height="8" rx="2" fill="rgba(123,45,58,0.07)"/>
        <circle cx="12" cy="-18" r="2.5" fill="#7B2D3A" opacity="0.7"/>
        <circle cx="12" cy="-6"  r="2.5" fill="rgba(123,45,58,0.35)"/>
        <circle cx="12" cy="6"   r="2.5" fill="rgba(123,45,58,0.2)"/>
        <text x="0" y="44" text-anchor="middle" font-family="'DM Sans',sans-serif" font-size="8" fill="rgba(123,45,58,0.6)">Hospital</text>
    </g>

    <!-- Home Router (lower right) -->
    <g transform="translate(318, 210)">
        <rect x="-56" y="-30" width="112" height="60" rx="6" fill="#EDE6D8" stroke="rgba(58,92,59,0.35)" stroke-width="1.5"/>
        <line x1="-22" y1="-18" x2="-26" y2="-28" stroke="rgba(58,92,59,0.55)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="0"   y1="-18" x2="0"   y2="-30" stroke="rgba(58,92,59,0.55)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="22"  y1="-18" x2="26"  y2="-28" stroke="rgba(58,92,59,0.55)" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="-40" y="-12" width="80" height="24" rx="3" fill="rgba(58,92,59,0.1)" stroke="rgba(58,92,59,0.25)" stroke-width="1"/>
        <circle cx="-20" cy="0" r="3" fill="#3A5C3B" opacity="0.8"/>
        <circle cx="-10" cy="0" r="3" fill="rgba(58,92,59,0.35)"/>
        <circle cx="0"   cy="0" r="3" fill="rgba(58,92,59,0.35)"/>
        <text x="0" y="38" text-anchor="middle" font-family="'DM Sans',sans-serif" font-size="9" font-weight="700" fill="rgba(58,92,59,0.8)" letter-spacing="0.04em">Home Router</text>
    </g>

    <!-- Router to Internet -->
    <line x1="375" y1="210" x2="404" y2="210" stroke="rgba(58,92,59,0.4)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="404,206 414,210 404,214" fill="rgba(58,92,59,0.4)"/>

    <!-- Internet cloud -->
    <g transform="translate(442, 210)">
        <ellipse cx="0" cy="0" rx="28" ry="18" fill="rgba(44,31,20,0.06)" stroke="rgba(44,31,20,0.18)" stroke-width="1" stroke-dasharray="3 2"/>
        <ellipse cx="-12" cy="-8" rx="14" ry="10" fill="rgba(44,31,20,0.04)" stroke="rgba(44,31,20,0.12)" stroke-width="1" stroke-dasharray="3 2"/>
        <ellipse cx="12" cy="-10" rx="12" ry="8" fill="rgba(44,31,20,0.04)" stroke="rgba(44,31,20,0.12)" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="0" y="4" text-anchor="middle" font-family="'DM Sans',sans-serif" font-size="9" fill="rgba(44,31,20,0.45)">Internet</text>
        <text x="0" y="32" text-anchor="middle" font-family="'DM Sans',sans-serif" font-size="8" fill="rgba(44,31,20,0.3)" font-style="italic">direct</text>
    </g>

    <!-- Legend strip -->
    <rect x="16" y="252" width="220" height="16" rx="3" fill="rgba(44,31,20,0.05)" stroke="rgba(44,31,20,0.08)" stroke-width="1"/>
    <line x1="24" y1="260" x2="40" y2="260" stroke="#7B2D3A" stroke-width="2"/>
    <text x="46" y="264" font-family="'DM Sans',sans-serif" font-size="8" fill="rgba(44,31,20,0.5)">Work traffic: via VPN</text>
    <line x1="122" y1="260" x2="138" y2="260" stroke="#3A5C3B" stroke-width="3"/>
    <text x="144" y="264" font-family="'DM Sans',sans-serif" font-size="8" fill="rgba(44,31,20,0.5)">Internet: direct home</text>

</svg>
